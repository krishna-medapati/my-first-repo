<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Registration - krishna</title>
  <script>
    function handleSubmit(event) {
      event.preventDefault();
      alert("Saved your profile.");
    }
  </script>
</head>

<body>
  <h1>Registration Form</h1>

  <form onsubmit="handleSubmit(event)">
    <label for="name">Name:</label><br>
    <input type="text" id="name" required><br><br>

    <label for="fatherName">Father's Name:</label><br>
    <input type="text" id="fatherName" required><br><br>

    <label for="dob">Date of Birth:</label><br>
    <input type="date" id="dob" required><br><br>

    <label for="address">Address:</label><br>
    <textarea id="address" required></textarea><br><br>

    <label for="email">Email:</label><br>
    <input type="email" id="email" required><br><br>

    Gender:<br>
    <input type="radio" name="gender" value="Male" required> Male<br>
    <input type="radio" name="gender" value="Female" required> Female<br><br>

    Qualification:<br>
    <select id="qualification" required>
      <option value="">Select</option>
      <option value="10th">10th</option>
      <option value="12th">12th</option>
      <option value="B.Tech">B.Tech</option>
      <option value="M.Tech">M.Tech</option>
    </select><br><br>

    Hobbies:<br>
    <input type="checkbox" value="Reading"> Reading<br>
    <input type="checkbox" value="Traveling"> Traveling<br>
    <input type="checkbox" value="Music"> Music<br><br>

    <button type="submit">Submit</button>
  </form>
</body>

</html>
