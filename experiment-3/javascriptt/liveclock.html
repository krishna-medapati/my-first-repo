<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Date & Time Buttons</title>
</head>

<body>
    <h2>Date & Time Display</h2>

    <button onclick="showTime()">Show Time</button>
    <button onclick="showDate()">Show Date</button>

    <div id="output" style="font-size: 24px; font-weight: bold; margin-top: 20px;"></div>

    <script>
        function showTime() {
            let now = new Date();
            document.getElementById('output').innerHTML = now.toLocaleTimeString();
        }

        function showDate() {
            let now = new Date();
            document.getElementById('output').innerHTML = now.toLocaleDateString();
        }
    </script>
</body>

</html>
