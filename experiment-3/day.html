<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day Number to Day Name (Switch)</title>
</head>

<body>
    <h2>Day Number to Day Name</h2>

    <label>Enter Day Number (1–7):</label>
    <input type="number" id="dayNum" min="1" max="7"><br><br>

    <button onclick="showDay()">Show Day</button>

    <h3>Day Name: <span id="dayName">---</span></h3>

    <script>
        function showDay() {
            let num = parseInt(document.getElementById("dayNum").value);
            let result;

            switch (num) {
                case 1: result = "Sunday"; break;
                case 2: result = "Monday"; break;
                case 3: result = "Tuesday"; break;
                case 4: result = "Wednesday"; break;
                case 5: result = "Thursday"; break;
                case 6: result = "Friday"; break;
                case 7: result = "Saturday"; break;
                default: result = "Invalid! Enter between 1 and 7.";
            }

            document.getElementById("dayName").innerText = result;
        }
    </script>
</body>

</html>
