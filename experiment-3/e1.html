<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotlist Table</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        table {
            border-collapse: collapse;
            width: 80%;
            margin: auto;
            background: white;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        th,
        td {
            padding: 12px 15px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background-color: #333;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        tr:hover {
            background-color: #f1f1f1;
        }
    </style>
</head>

<body>

    <h2>Hotlist Codec</h2>

    <table>
        <thead>
            <tr>
                <th>Rank</th>
                <th>Name</th>
                <th>Category</th>
                <th>Score</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>Codec Alpha</td>
                <td>Video</td>
                <td>9.8</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Codec Beta</td>
                <td>Audio</td>
                <td>9.5</td>
            </tr>
            <tr>
                <td>3</td>
                <td>Codec Gamma</td>
                <td>Video</td>
                <td>9.2</td>
            </tr>
            <tr>
                <td>4</td>
                <td>Codec Delta</td>
                <td>Audio</td>
                <td>8.9</td>
            </tr>
        </tbody>
    </table>

</body>

</html>
